# Build the Regista service image on GitHub's runners and push it to the Azure Container Registry.
# Free-trial Azure subscriptions cannot run ACR Tasks (`az containerapp up --source` / `az acr build`),
# so the image is built here and the container app is pointed at it (see infra/deploy-app.sh).
#
# Secrets: ACR_LOGIN_SERVER (e.g. myregistry.azurecr.io), ACR_USERNAME, ACR_PASSWORD (registry admin user
# or a push-scoped token). The workflow never touches Azure beyond pushing the image.
name: build-image

on:
  push:
    branches: [main]
    paths: ["src/**", "data/synthetic/**", "Dockerfile", ".dockerignore", "pyproject.toml", "README.md", "LICENSE", ".github/workflows/build-image.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/regista:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/regista:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "pushed ${{ secrets.ACR_LOGIN_SERVER }}/regista:${{ github.sha }}"
