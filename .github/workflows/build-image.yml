# Run the test suite, build the Regista service image on GitHub's runners, smoke-test the agent tools inside it, and
# (on main only) push it to the Azure Container Registry. A failing test or smoke test stops the push. Pull requests
# get the same checks without pushing anything.
# Free-trial Azure subscriptions cannot run ACR Tasks (`az containerapp up --source` / `az acr build`),
# so the image is built here and the container app is pointed at it (see infra/deploy-app.sh).
#
# Secrets: ACR_LOGIN_SERVER (e.g. myregistry.azurecr.io), ACR_USERNAME, ACR_PASSWORD (registry admin user
# or a push-scoped token). The workflow never touches Azure beyond pushing the image.
name: build-image

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "data/synthetic/**", "Dockerfile", ".dockerignore", "pyproject.toml", "README.md", "LICENSE", ".github/workflows/build-image.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,vision,cloud]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: regista:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The Azure MCP Server is a .NET binary; whether it starts depends on the image, not the laptop. List the agent
      # tools inside the image (an MCP handshake only: no credentials, nothing queried) before anything is pushed.
      - name: Smoke-test agent tools inside the image
        run: docker run --rm regista:ci python -m regista.cloud.smoke
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - if: env.PUSH == 'true'
        name: Push to the registry
        run: |
          for tag in "${{ github.sha }}" latest; do
            docker tag regista:ci "${{ secrets.ACR_LOGIN_SERVER }}/regista:$tag"
            docker push "${{ secrets.ACR_LOGIN_SERVER }}/regista:$tag"
          done
          echo "pushed ${{ secrets.ACR_LOGIN_SERVER }}/regista:${{ github.sha }}"
