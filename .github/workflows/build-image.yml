# Test, build, smoke-test, push, deploy. A failing step stops everything after it.
#
#   test     the full suite
#   build    the service image, then `python -m regista.cloud.smoke` inside it (both MCP servers must list their tools,
#            and the dashboards' static files and the four sample matches must be in the image); on main, the image is pushed to Azure Container Registry
#   deploy   on main, the container app is updated to that image and the run waits until the new revision is ready
#
# Pull requests get test and build (no push, no deploy). Azure sign-in uses a federated identity (OpenID Connect):
# no password or key is stored in GitHub. infra/provision.sh creates it and sets the repository variables used below;
# until they exist, push and deploy are skipped.
name: build-image

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "data/synthetic/**", "data/season/**", "Dockerfile", ".dockerignore", "pyproject.toml", "README.md", "LICENSE",
            ".github/workflows/build-image.yml", "infra/ci-deploy.sh", "infra/lib/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for the federated Azure sign-in

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,vision,cloud]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: regista:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The Azure MCP Server is a .NET binary; whether it starts depends on the image, not the laptop. List the agent
      # tools inside the image (an MCP handshake only: no credentials, nothing queried) before anything is pushed.
      - name: Smoke-test agent tools inside the image
        run: docker run --rm regista:ci python -m regista.cloud.smoke
      - if: env.PUSH == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: env.PUSH == 'true'
        name: Push to the registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          for tag in "${{ github.sha }}" latest; do
            docker tag regista:ci "${{ vars.ACR_LOGIN_SERVER }}/regista:$tag"
            docker push "${{ vars.ACR_LOGIN_SERVER }}/regista:$tag"
          done
      - if: env.PUSH != 'true'
        run: echo "not pushed (pull request, or the Azure variables are not set yet; see infra/SETUP.md)"

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy-live-app   # one deploy at a time; a newer push waits for the running one
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the new image and wait until it is the ready revision
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/regista:${{ github.sha }}
          AZURE_RG: ${{ vars.AZURE_RG }}
          ACA_APP: ${{ vars.ACA_APP }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt -o none
          ./infra/ci-deploy.sh
