<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regista · sandbox</title>
<link rel="stylesheet" href="sandbox.css">
</head>
<body>
<header class="top">
  <p class="brand">REGI<span>STA</span></p>
</header>
<div class="shell">
<nav class="side" aria-label="Views">
  <a href="#home" data-view="home">Home</a>
  <a href="#profile" data-view="profile">Player profile</a>
  <a href="#scout" data-view="scout">Scout</a>
</nav>
<main>
  <section id="home" data-view="home" aria-label="Home">
    <form class="search" role="search">
      <label class="sr" for="q">Search every match</label>
      <input id="q" type="search" autocomplete="off" placeholder="Find me shots from outside the box this season">
      <button type="submit">Search</button>
    </form>
    <div class="examples" aria-label="Try">
      <button type="button" class="chip">Shots from outside the box this season</button>
      <button type="button" class="chip">Every header</button>
      <button type="button" class="chip">All the nutmegs</button>
      <button type="button" class="chip">Take-ons in the final third</button>
      <button type="button" class="chip">Every assist, best first</button>
      <button type="button" class="chip">Femi Toure's goals, assists and shots</button>
    </div>
  </section>
  <section id="profile" data-view="profile" aria-label="Player profile" hidden></section>
  <section id="scout" data-view="scout" aria-label="Scout" hidden></section>
</main>
</div>
<script src="sandbox.js"></script>
</body>
</html>
