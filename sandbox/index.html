<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regista · sandbox</title>
<link rel="stylesheet" href="sandbox.css">
</head>
<body>
<header class="top">
  <p class="brand">REGI<span>STA</span></p>
</header>
<div class="shell">
<nav class="side" aria-label="Views">
  <a href="#home" data-view="home">Home</a>
  <a href="#profile" data-view="profile">Player profile</a>
  <a href="#scout" data-view="scout">Scout</a>
</nav>
<main>
  <section id="home" data-view="home" aria-label="Home">
    <p class="logo" aria-hidden="true">REGI<span>STA</span></p>
    <p class="tagline">Every moment. Every highlight. Every player. Found in seconds.</p>
    <form class="search" role="search">
      <label class="sr" for="q">Ask for any moment, from any match this season</label>
      <input id="q" type="search" autocomplete="off" placeholder="Ask for any moment, from any match this season">
      <button type="submit">Search</button>
    </form>
    <div class="engine" role="radiogroup" aria-label="Who answers">
      <label><input type="radio" name="engine" value="rules" checked><span>Data Search</span></label>
      <label><input type="radio" name="engine" value="foundry"><span>Ask Microsoft Foundry</span></label>
    </div>
  </section>
  <section id="results" aria-label="Results" hidden>
    <div class="rbar">
      <form class="search compact" role="search" id="rsearch">
        <label class="sr" for="rq">Search every match</label>
        <input id="rq" type="search" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <div class="engine inline" role="radiogroup" aria-label="Who answers">
        <label><input type="radio" name="rengine" value="rules" checked><span>Data Search</span></label>
        <label><input type="radio" name="rengine" value="foundry"><span>Ask Microsoft Foundry</span></label>
      </div>
    </div>
    <div class="rbody">
      <div class="rgrid-wrap">
        <p class="rcount" id="rcount"></p>
        <div class="rgrid" id="rgrid"></div>
      </div>
      <aside class="foundry" id="foundry" aria-label="Conversation" hidden></aside>
    </div>
  </section>
  <section id="matchview" aria-label="Match" hidden>
    <div class="mbody">
      <div class="mmain">
        <a href="#search" class="back">&larr; Back to results</a>
        <h2 class="mtitle" id="mtitle"></h2>
        <div class="tline" id="tline" aria-label="Moments on the match timeline"></div>
        <div class="stage">
          <div class="player"><span>&#9654;</span></div>
          <div class="sinfo">
            <span class="reason" id="sreason"></span>
            <h3 class="stitle" id="stitle"></h3>
            <span class="tags" id="stags"></span>
            <p class="sexpl" id="sexpl"></p>
          </div>
          <div class="actions">
            <button type="button" id="playreel">Play reel</button>
            <button type="button" class="alt">Download reel</button>
            <button type="button" class="alt">Export moments</button>
            <button type="button" class="alt">Watch the full match</button>
          </div>
        </div>
        <details class="recap" id="recap">
          <summary>Match recap</summary>
          <h3 id="rhead"></h3>
          <div id="rparas"></div>
        </details>
        <p class="rcount" id="mcount"></p>
        <div class="rgrid" id="mgrid"></div>
      </div>
      <aside class="foundry convo" id="convo" aria-label="Conversation"></aside>
    </div>
  </section>
  <section id="profile" data-view="profile" aria-label="Player profile" hidden></section>
  <section id="scout" data-view="scout" aria-label="Scout" hidden></section>
</main>
</div>
<script src="sandbox.js"></script>
</body>
</html>
