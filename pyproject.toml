[project]
name = "regista"
version = "0.1.0"
description = "Regista directs every touch. Synthetic football event stream, clip rule, and labelling for the Inside the Game hackathon."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10.1",
  "numpy>=1.26",
  "imageio>=2.34",
  "imageio-ffmpeg==0.6.0",
  "mcp>=1.2,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
cloud = [
  "agent-framework>=1.22,<2",
  "agent-framework-foundry>=1.0,<2",
  "azure-identity>=1.20,<2",
  "azure-cosmos>=4.9,<5",
  "azure-search-documents>=12,<13",
  "msmcp-azure==3.0.0",
  "azure-monitor-opentelemetry>=1.8.10,<2",
]
dev = [
  "pytest>=8",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regista = ["static/*.html", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
