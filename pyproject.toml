[project]
name = "regista"
version = "0.1.0"
description = "Regista directs every touch. Synthetic football event stream, clip rule, and labelling for the Inside the Game hackathon."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10.1",
  "numpy>=1.26",
  "imageio>=2.34",
  "imageio-ffmpeg==0.6.0",
  "mcp>=1.2,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9",
  "agent-framework>=1.22,<2",  # the default pipeline engine is an Agent Framework workflow
]

[project.optional-dependencies]
cloud = [
  "agent-framework-foundry>=1.0,<2",
  "azure-identity>=1.20,<2",
  "azure-cosmos>=4.9,<5",
  "azure-search-documents>=12,<13",
  "msmcp-azure==3.0.0",
  "azure-monitor-opentelemetry>=1.8.10,<2",
  "azure-storage-blob>=12.20,<13",
  "azure-storage-queue>=12.10,<13",
  "deltalake>=1.0,<2",  # Microsoft Fabric: the season as Delta tables in OneLake (regista.cloud.fabric)
  "pyarrow>=15",
]
vision = [
  "opencv-python-headless>=4.10",
  "scikit-learn>=1.7,<1.8",  # the trained vision models are pickled with 1.7.2; 1.8 cannot load them (seen in the Azure job)
  "scipy>=1.11",
  "joblib>=1.3",
]
dev = [
  "pytest>=8",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regista = ["static/*/*.html", "static/*/*.js", "static/*/*.css", "static/*/*.svg", "static/*/icons/*.svg", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
